<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dicionário do Mercado Financeiro</title>
  <meta name="description" content="Dicionário de termos do mercado financeiro com explicação simples e detalhada.">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/tema.js"></script>
</head>
<body>
  <header class="hero">
    <svg class="deco deco-grafico" viewBox="0 0 1200 220" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="g-area" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="currentColor" stop-opacity=".3"/>
          <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="g-linha" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="220">
          <stop offset="0" stop-color="currentColor" stop-opacity=".7"/>
          <stop offset=".55" stop-color="currentColor" stop-opacity=".7"/>
          <stop offset="1" stop-color="currentColor" stop-opacity=".1"/>
        </linearGradient>
      </defs>
      <path class="grafico-area"/>
      <path class="grafico-linha"/>
    </svg>
    <div class="deco deco-candles" aria-hidden="true"></div>
    <svg class="deco deco-pizza" viewBox="0 0 120 120" aria-hidden="true"></svg>

    <button id="tema-toggle" class="tema-toggle" type="button" aria-label="Mudar tema">
      <svg class="icone-lua" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icone-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <p class="eyebrow">Guia de bolso</p>
    <h1>Dicionário do <em>Mercado Financeiro</em></h1>
    <p class="sub">Cada termo explicado de forma simples, com o aprofundamento a um clique de distância.</p>
  </header>

  <main class="container">
    <div class="toolbar">
      <div class="busca-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="busca" type="search" placeholder="Buscar termo, sigla ou definição…" autocomplete="off" aria-label="Buscar">
      </div>
      <nav id="indice" aria-label="Índice alfabético"></nav>
    </div>

    <div class="barra-resultado">
      <div id="contagem" aria-live="polite"></div>
      <button id="toggle-todas" class="btn-todas" type="button" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5 5 5-5"/></svg>
        <span>Expandir todas</span>
      </button>
    </div>

    <div id="lista"></div>
  </main>

  <footer>
    Conteúdo educativo e informativo. Não constitui recomendação de investimento.
  </footer>

  <script src="js/termos.js"></script>
  <script src="js/app.js"></script>
  <script src="js/hero.js"></script>
</body>
</html>
